<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeLink live auction test</title>
  <style>
    body { font: 16px system-ui; max-width: 760px; margin: 40px auto; padding: 0 16px; }
    input, button { padding: 10px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    pre { background: #111; color: #d9f7d9; padding: 16px; overflow: auto; min-height: 160px; }
  </style>
</head>
<body>
  <h1>TradeLink WebSocket test</h1>
  <p>Get a JWT from <code>POST /auth/login</code> first. This page demonstrates live updates, not the full frontend.</p>
  <label>Auction ID</label><input id="auction" type="number" value="1">
  <label>JWT token</label><input id="token" placeholder="Paste access_token">
  <button id="connect">Connect</button>
  <pre id="log">Not connected.</pre>
  <script>
    const log = document.getElementById('log');
    document.getElementById('connect').onclick = () => {
      const id = document.getElementById('auction').value;
      const token = document.getElementById('token').value.trim();
      const ws = new WebSocket(`ws://${location.hostname || '127.0.0.1'}:8000/ws/auctions/${id}?token=${encodeURIComponent(token)}`);
      ws.onopen = () => log.textContent = 'Connected. Waiting for events...';
      ws.onmessage = e => log.textContent = e.data + '\n' + log.textContent;
      ws.onerror = () => log.textContent = 'WebSocket error. Check the token and API server.';
      ws.onclose = () => log.textContent = 'Connection closed.\n' + log.textContent;
    };
  </script>
</body>
</html>
